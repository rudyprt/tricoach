services:
  - type: web
    name: tricoach
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Votre email, pour obtenir le rôle administrateur sans ligne de commande.
      # À renseigner APRÈS avoir créé votre compte dans l'application.
      - key: ADMIN_EMAILS
        sync: false
      # URL publique du service, utilisée dans les liens des e-mails.
      - key: APP_URL
        sync: false
      # Envoi d'e-mails (récupération de mot de passe, vérification d'adresse).
      # Sans SMTP_HOST, aucun e-mail ne part.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
