services:
  - type: web
    name: tricoach
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Votre email, pour obtenir le rôle administrateur sans ligne de commande.
      # À renseigner APRÈS avoir créé votre compte dans l'application.
      - key: ADMIN_EMAILS
        sync: false
