services:
  - type: web
    name: tricoach
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Votre email, pour obtenir le rôle administrateur sans ligne de commande.
      # À renseigner APRÈS avoir créé votre compte dans l'application.
      - key: ADMIN_EMAILS
        sync: false
      # URL publique du service, utilisée dans les liens des e-mails.
      - key: APP_URL
        sync: false
      # Envoi d'e-mails (récupération de mot de passe, vérification d'adresse).
      # Sans SMTP_HOST, aucun e-mail ne part.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Les rappels par e-mail partent dès que SMTP_HOST est renseigné :
      # ils utilisent la même configuration d'envoi que le reste.
      # Notifications poussées (facultatif mais recommandé) : elles arrivent
      # sur l'écran tout de suite, sans dépendre d'un envoi d'e-mail.
      # Générer la paire de clés : npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Contact exigé par la spécification : "mailto:vous@exemple.fr"
      - key: VAPID_SUBJECT
        sync: false
      # Connexion Strava (facultatif) : sans ces valeurs, la fonctionnalité
      # n'apparaît pas dans l'application.
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
